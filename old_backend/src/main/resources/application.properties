# ── Datasource ──────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/tiklasat
spring.datasource.username=postgres
spring.datasource.password=dev
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ────────────────────────────────────
# ADR-0002: ddl-auto SADECE validate. Sema yonetimi Flyway ile yapilir.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── Flyway ──────────────────────────────────────────────
# Migration dosyalari proje kokunde db/migration/ altinda duruyor.
spring.flyway.enabled=true
spring.flyway.locations=filesystem:db/migration
spring.flyway.baseline-on-migrate=true

# ── JWT (BR-S-002) ─────────────────────────────────────
# Uretimde bu deger ortam degiskeninden (env var) alinmalidir!
tiklasat.jwt.secret=tiklasat-dev-secret-key-change-in-production-minimum-256-bits-required-here
tiklasat.jwt.access-token-expiration-ms=900000
tiklasat.jwt.refresh-token-expiration-ms=604800000