version: '3.8'

services:
  # ── PostgreSQL (Veritabanı) ──────────────────────────
  postgres:
    image: postgres:16
    container_name: tiklasat-db
    environment:
      POSTGRES_DB: tiklasat
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # ── Redis (Cache & Rate Limiting) ────────────────────
  redis:
    image: redis:7-alpine
    container_name: tiklasat-redis
    ports:
      - "6379:6379"

  # ── RabbitMQ (Mesaj Kuyruğu) ─────────────────────────
  rabbitmq:
    image: rabbitmq:3-management
    container_name: tiklasat-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"     # AMQP (Spring Boot bağlantısı)
      - "15672:15672"   # Admin Paneli (Tarayıcıdan erişim)
      - "61613:61613"   # STOMP (WebSocket Relay)
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    command: >
      bash -c "rabbitmq-plugins enable rabbitmq_stomp && rabbitmq-server"

volumes:
  postgres_data:
  rabbitmq_data:
