# ── Datasource ──────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5433/tiklasat
spring.datasource.username=postgres
spring.datasource.password=dev
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ────────────────────────────────────
# Şema artık Flyway tarafından yönetiliyor. Hibernate sadece DOĞRULAR,
# tablo oluşturmaz/silmez (ADR-0002).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── Flyway ──────────────────────────────────────────────
# Migration dosyaları proje kökünde db/migration/ altında duruyor,
# Flyway'in varsayılan aradığı yer (classpath:db/migration) değil.
spring.flyway.enabled=true
spring.flyway.locations=filesystem:db/migration

# ── Redis ──────────────────────────────────────────────
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis

# ── RabbitMQ ───────────────────────────────────────────
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Sunucu Portu
server.port=8080
